    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background-color: #020617; color: #f8fafc; display: flex; justify-content: center; line-height: 1.6; padding: 20px; }

        .dashboard { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid #1e293b; font-weight: 600; font-size: 1.3em; color: #cbd5e1; }

        .question-container { background: #0f172a; padding: 40px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: none; margin-bottom: 20px; border: 1px solid #1e293b; }
        .question-container.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .q-text { font-size: 1.3em; font-weight: 600; margin-bottom: 25px; color: #f1f5f9; }
        .subject-tag { display: inline-block; padding: 5px 15px; background: #020617; color: #6ee7b7; font-size: 0.85em; border-radius: 15px; margin-bottom: 20px; font-weight: 700; border: 1px solid #059669; text-transform: uppercase; letter-spacing: 1px; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #1e293b; border: 2px solid #334155; padding: 18px; border-radius: 10px; text-align: left; font-size: 1.1em; cursor: pointer; transition: all 0.2s; color: #e2e8f0; font-weight: 500; }
        .option-btn:hover:not(.disabled) { background: #334155; border-color: #10b981; transform: translateX(5px); }
        .option-btn.correct { background: #064e3b; border-color: #059669; color: #a7f3d0; font-weight: 600; box-shadow: 0 0 15px rgba(5, 150, 105, 0.3); }
        .option-btn.incorrect { background: #7f1d1d; border-color: #dc2626; color: #fecaca; box-shadow: 0 0 15px rgba(220, 38, 38, 0.3); }
        .option-btn.disabled { pointer-events: none; }
        
        .rationale { margin-top: 25px; padding: 20px; background: #064e3b; border-left: 5px solid #10b981; border-radius: 0 8px 8px 0; display: none; font-size: 1.1em; color: #d1fae5; animation: fadeIn 0.4s; line-height: 1.5; border-top: 1px solid #059669; border-right: 1px solid #059669; border-bottom: 1px solid #059669; }
        .rationale strong { color: #6ee7b7; font-size: 1.15em; text-transform: uppercase; display: block; margin-bottom: 10px; border-bottom: 1px solid #059669; padding-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .navigation { display: flex; justify-content: space-between; margin-top: 30px; }
        .nav-btn { background: #10b981; color: #020617; border: none; padding: 15px 35px; border-radius: 8px; font-size: 1.1em; cursor: pointer; transition: 0.3s; font-weight: 700; text-transform: uppercase; }
        .nav-btn:hover:not(:disabled) { background: #059669; color: #fff; transform: translateY(-2px); }
        .nav-btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; transform: none; }
        
        .progress-bar { width: 100%; background: #1e293b; height: 12px; border-radius: 6px; margin-bottom: 25px; overflow: hidden; border: 1px solid #334155; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #059669, #34d399); width: 0%; transition: width 0.3s ease; }
        
        #results-screen { display: none; background: #0f172a; padding: 50px; border-radius: 12px; text-align: center; border: 1px solid #1e293b; }
        .final-score { font-size: 4em; color: #34d399; font-weight: 800; margin: 20px 0; }

<script>
// Array of 100 GI Questions
const questions = [
    { q: "A patient with liver cirrhosis has a Sengstaken-Blakemore tube inserted for bleeding esophageal varices. The patient suddenly exhibits severe respiratory distress. What is the nurse's absolute FIRST priority action?", o: ["Deflate the esophageal balloon", "Cut the tube with scissors and pull it out", "Increase the pressure in the gastric balloon", "Perform emergency tracheostomy"], a: 1, t: "GI Emergencies", e: "If the gastric balloon ruptures or deflates, the tube migrates upward, and the inflated esophageal balloon completely blocks the airway. The immediate life-saving action is to cut the tube (to rapidly deflate all balloons) and extract it." },
    { q: "Which clinical finding definitively differentiates a gastric ulcer from a duodenal ulcer?", o: ["Pain occurring 2-3 hours after a meal", "Pain relieved by eating food", "Pain exacerbated by eating food", "Presence of melena"], a: 2, t: "Upper GI", e: "Gastric ulcer pain is typically exacerbated immediately or shortly after eating (food touches the raw ulcer). Duodenal ulcer pain occurs 2-3 hours after meals when the stomach empties acid into the duodenum, and is often RELIEVED by eating food, which buffers the acid." },
    { q: "A patient with acute pancreatitis develops a bluish discoloration around the umbilicus. How should the nurse document this, and what does it indicate?", o: ["Grey Turner's sign; indicates retroperitoneal bleeding", "Cullen's sign; indicates retroperitoneal/intra-abdominal bleeding", "Murphy's sign; indicates gallbladder inflammation", "McBurney's sign; indicates appendiceal rupture"], a: 1, t: "Pancreatic/Biliary", e: "Cullen's sign is a bluish, umbilical discoloration indicating intra-abdominal or retroperitoneal hemorrhage (hemorrhagic pancreatitis). Grey Turner's sign is bluish discoloration on the flanks." },
    { q: "A client is scheduled for a paracentesis to treat severe ascites. What is the most critical nursing intervention immediately PRIOR to the procedure?", o: ["Administer IV Albumin", "Ensure the client has a full bladder for ultrasound visualization", "Instruct the client to empty their bladder", "Place the client in a supine position"], a: 2, t: "GI Procedures", e: "The client MUST completely empty their bladder immediately before a paracentesis to prevent accidental puncture of the bladder by the trocar needle." },
    { q: "A patient receiving Total Parenteral Nutrition (TPN) has the infusion suddenly disconnected by a confused family member. The new bag is not available. What is the priority nursing intervention to prevent a fatal complication?", o: ["Hang 0.9% Normal Saline at the same rate", "Hang 10% Dextrose in Water (D10W) at the same rate", "Administer 1 ampule of Sodium Bicarbonate", "Flush the central line with Heparin and cap it"], a: 1, t: "GI Nutrition", e: "TPN is highly concentrated with glucose. The body secretes massive amounts of insulin to handle it. Abruptly stopping TPN causes profound rebound hypoglycemia. Hanging D10W maintains glucose levels until the new TPN bag arrives." },
    { q: "A patient is 2 days post-op from a Billroth II procedure (gastrojejunostomy) and develops severe cramping, diaphoresis, and palpitations 15 minutes after eating. What dietary teaching is essential to prevent Dumping Syndrome?", o: ["Drink plenty of fluids with every meal to dilute the food", "Eat a diet high in complex carbohydrates", "Eat small, frequent meals high in protein and fat, and lie down after eating", "Remain sitting upright for 2 hours after every meal"], a: 2, t: "Upper GI Surgery", e: "Dumping syndrome occurs when food 'dumps' rapidly into the jejunum. To slow gastric emptying: lie down for 30 mins after meals, avoid drinking fluids WITH meals, and eat high-protein, high-fat, low-carbohydrate meals (carbs digest too quickly)." },
    { q: "A patient with Inflammatory Bowel Disease asks the nurse how Crohn's disease is different from Ulcerative Colitis (UC). The nurse accurately explains:", o: ["UC affects the entire GI tract from mouth to anus, while Crohn's only affects the colon", "Crohn's disease causes continuous mucosal lesions, while UC causes skip lesions", "Crohn's involves transmural inflammation (all layers) with 'skip lesions', while UC is continuous and limited to the mucosal layer of the colon", "Surgery is curative for Crohn's disease but not for UC"], a: 2, t: "Lower GI", e: "Crohn's disease affects any part of the GI tract with 'skip lesions' (cobblestone appearance) and affects all bowel layers (transmural), prone to fistulas. UC is continuous, starts in the rectum, moves up the colon, and only affects the inner mucosa. Surgery (colectomy) cures UC, but not Crohn's." },
    { q: "A patient admitted with severe right lower quadrant pain, nausea, and rebound tenderness suddenly states, 'The pain is completely gone, I feel much better.' What is the nurse's immediate priority?", o: ["Document the improvement and discharge the patient", "Administer oral clear fluids", "Prepare the patient for emergency surgery and anticipate IV antibiotics", "Administer a fleet enema to clear the bowel"], a: 2, t: "GI Emergencies", e: "Sudden relief of severe appendicitis pain is a classic, ominous sign that the appendix has RUPTURED. Feces and bacteria are spilling into the peritoneum, risking fatal peritonitis. Emergency surgery and antibiotics are required." },
    { q: "A patient with cirrhosis has severe hepatic encephalopathy. The provider orders oral Lactulose. Which specific parameter must the nurse evaluate to determine if the medication is therapeutically effective?", o: ["Decreased abdominal girth", "Increased urine output", "Improved level of consciousness and orientation", "Stools become solid and formed"], a: 2, t: "Liver / Hepatic", e: "Lactulose acts to pull ammonia from the blood into the colon to be excreted. High ammonia causes hepatic encephalopathy (confusion, coma). The goal of Lactulose is to lower ammonia, which manifests clinically as an improved level of consciousness. Producing 2-3 soft/loose stools daily is the mechanism, not the clinical goal." },
    { q: "Which anatomical landmark is classically used to assess for McBurney's point tenderness in a patient with suspected appendicitis?", o: ["Midway between the umbilicus and the right anterior superior iliac spine", "The right upper quadrant just below the costal margin", "The left lower quadrant directly opposite the appendix", "The epigastric region radiating to the back"], a: 0, t: "GI Assessment", e: "McBurney's point is located one-third of the distance from the right anterior superior iliac spine to the umbilicus. Maximum tenderness here is the classic hallmark of acute appendicitis." },
    { q: "A patient with a hiatal hernia asks the nurse how to minimize severe heartburn. Which instruction is most appropriate?", o: ["'Lie down flat immediately after eating to slow digestion.'", "'Wear a tight abdominal binder to support the hernia.'", "'Elevate the head of your bed on 6-inch blocks and do not eat within 3 hours of bedtime.'", "'Drink large amounts of water with your meals.'"], a: 2, t: "Upper GI", e: "A hiatal hernia allows the stomach to slide up into the thorax, causing severe GERD. Gravity helps keep the stomach down. Patients should elevate the head of the bed, avoid tight clothing (which increases intra-abdominal pressure), and never eat right before lying down." },
    { q: "The nurse is reviewing the lab results of a patient admitted with acute pancreatitis. Which laboratory enzyme is the most SPECIFIC indicator of pancreatic damage?", o: ["Serum Amylase", "Serum Lipase", "Alkaline Phosphatase (ALP)", "Aspartate Aminotransferase (AST)"], a: 1, t: "Pancreatic/Biliary", e: "While both amylase and lipase elevate in acute pancreatitis, Serum Lipase is much more specific to the pancreas and remains elevated much longer than amylase." },
    { q: "A patient with Ulcerative Colitis is prescribed Sulfasalazine. The nurse should assess the patient for an allergy to which class of medications before administration?", o: ["Penicillins", "Sulfa drugs and Aspirin (Salicylates)", "Macrolides", "Cephalosporins"], a: 1, t: "GI Pharmacology", e: "Sulfasalazine is a combination of sulfapyridine (a sulfa drug) and 5-aminosalicylic acid (a salicylate, like aspirin). It is absolutely contraindicated in patients with a history of sulfa or aspirin allergies." },
    { q: "A patient develops a paralytic ileus after abdominal surgery. Which classic assessment finding confirms this diagnosis?", o: ["Hyperactive, high-pitched bowel sounds", "Absent bowel sounds and abdominal distention", "Severe, crampy, intermittent abdominal pain", "Passage of loose, watery stools"], a: 1, t: "Post-op GI", e: "A paralytic ileus is the cessation of peristalsis. The classic signs are absent bowel sounds (silent abdomen), generalized abdominal distention, and no passage of flatus or stool. High-pitched sounds indicate a mechanical obstruction, not a paralytic ileus." },
    { q: "A patient with a massive small bowel obstruction (SBO) is vomiting profusely. The nurse expects the ABG to show which classic acid-base imbalance?", o: ["Metabolic Acidosis", "Metabolic Alkalosis", "Respiratory Acidosis", "Respiratory Alkalosis"], a: 1, t: "GI Fluid/Electrolytes", e: "Profuse vomiting from a high (small) bowel obstruction causes massive loss of hydrochloric acid (HCl) from the stomach. Losing acid leads to Metabolic Alkalosis. (A lower/large bowel obstruction causes loss of alkaline fluids in stool, leading to metabolic acidosis)." },
    { q: "A patient with cirrhosis has a prothrombin time (PT) of 24 seconds (normal 11-12.5). The nurse notes oozing from IV sites. Which vitamin is the liver failing to utilize, leading to this coagulopathy?", o: ["Vitamin A", "Vitamin B12", "Vitamin D", "Vitamin K"], a: 3, t: "Liver / Hepatic", e: "The liver requires Vitamin K to synthesize clotting factors (II, VII, IX, X). In severe cirrhosis, the liver cannot utilize Vitamin K or synthesize these factors, leading to a prolonged PT and severe bleeding risks." },
    { q: "A patient with an acute exacerbation of Crohn's disease is prescribed infliximab (Remicade). Before initiating this biologic therapy, what screening test is absolutely mandatory?", o: ["Hemoglobin A1C", "Tuberculin (PPD) skin test or QuantiFERON Gold", "Echocardiogram", "Bone density scan"], a: 1, t: "GI Pharmacology", e: "Infliximab is a TNF-alpha inhibitor that severely suppresses the immune system. It can reactivate latent Tuberculosis (TB). A negative TB screen is legally and clinically mandatory before starting any TNF inhibitor." },
    { q: "A client is returning to the unit following an Esophagogastroduodenoscopy (EGD). What is the nurse's priority assessment before offering the patient oral fluids?", o: ["Auscultate bowel sounds in all 4 quadrants", "Assess for the return of the gag reflex", "Check the patient's gag reflex by offering a small sip of water", "Verify the patient's blood pressure is stable"], a: 1, t: "GI Procedures", e: "During an EGD, the throat is numbed with a local anesthetic spray to prevent gagging. The nurse must physically assess the return of the gag reflex (using a tongue depressor) BEFORE allowing the patient to consume anything orally to prevent fatal aspiration." },
    { q: "A patient with hepatic encephalopathy is exhibiting asterixis. How does the nurse assess for this sign?", o: ["Tap the facial nerve to look for a spasm", "Dorsiflex the patient's wrist and observe for a rapid, flapping tremor of the hands", "Stroke the sole of the foot to check for fanning of the toes", "Flex the patient's neck and observe for hip flexion"], a: 1, t: "GI Assessment", e: "Asterixis (liver flap) is a classic motor disturbance in hepatic encephalopathy caused by ammonia toxicity in the brain. It is elicited by having the patient extend their arms and dorsiflex their wrists; the hands will involuntarily flap downward and back up." },
    { q: "A patient with a suspected perforated peptic ulcer presents to the ED. Which triad of clinical signs is the hallmark of this catastrophic event?", o: ["Bradycardia, hypothermia, and melena", "Sudden severe abdominal pain, a rigid/board-like abdomen, and signs of shock", "Hyperactive bowel sounds, diarrhea, and fever", "Painless hematemesis, jaundice, and ascites"], a: 1, t: "GI Emergencies", e: "When an ulcer perforates, highly acidic gastric contents spill into the sterile peritoneal cavity. This causes instant chemical peritonitis, characterized by sudden, agonizing pain, a rigid/board-like abdomen, absent bowel sounds, and rapid progression to septic/hypovolemic shock." },
    { q: "The nurse is providing discharge teaching to a patient with newly diagnosed Celiac Disease. Which grain is safe for this patient to consume?", o: ["Wheat", "Rye", "Rice", "Barley"], a: 2, t: "GI Nutrition", e: "Celiac disease is an autoimmune intolerance to gluten. Patients must strictly avoid the 'BROW' grains: Barley, Rye, Oats (unless certified gluten-free), and Wheat. Rice and Corn are naturally gluten-free and perfectly safe." },
    { q: "A patient with acute diverticulitis is admitted. The nurse anticipates which dietary order during the ACUTE phase of the illness?", o: ["High fiber diet with bran and whole grains", "Clear liquid diet or NPO to rest the bowel", "High fat, low carbohydrate diet", "Pureed mechanical soft diet"], a: 1, t: "Lower GI", e: "During acute diverticulitis, the bowel is highly inflamed and at risk for perforation. The bowel MUST be rested. The patient is kept NPO or on strict clear liquids. A high-fiber diet is used to PREVENT diverticulitis, but is strictly contraindicated during an acute attack." },
    { q: "A patient has a newly created ileostomy. The nurse assesses the stoma 24 hours post-op. Which stoma appearance requires immediate notification of the surgeon?", o: ["Beefy red and moist", "Swollen and pink", "Dark purple or blackish", "Oozing a small amount of blood when wiped"], a: 2, t: "GI Surgeries/Ostomy", e: "A normal, healthy stoma is highly vascular, appearing beefy red or pink and moist. A stoma that is pale, dusky, dark purple, or black indicates severe ischemia and necrosis (loss of blood supply). This is a surgical emergency." },
    { q: "A patient is admitted with Hepatitis B. How is this specific virus primarily transmitted?", o: ["Fecal-oral route via contaminated food or water", "Airborne droplet nuclei", "Blood and body fluids (sexual contact, IV drug use)", "Mosquito vectors"], a: 2, t: "Liver / Hepatic", e: "Hepatitis B (and C) are transmitted via infected blood and body fluids (parenteral, sexual, perinatal). Hepatitis A and E are transmitted via the fecal-oral route." },
    { q: "A patient with cholelithiasis (gallstones) has a stone completely blocking the common bile duct. The nurse knows this will cause an absence of bilirubin in the intestines. What classic symptom will the patient exhibit?", o: ["Black, tarry stools (melena)", "Clay-colored (acholic) stools", "Bright red blood per rectum (hematochezia)", "Green, watery diarrhea"], a: 1, t: "Pancreatic/Biliary", e: "Bilirubin (which makes stool brown) cannot reach the intestines if the common bile duct is blocked. Without bilirubin, the stool becomes pale, putty-like, or clay-colored. The backup of bilirubin into the blood causes severe jaundice and dark, tea-colored urine." },
    { q: "A patient receiving enteral tube feedings via a nasogastric (NG) tube is found coughing, short of breath, and has an SpO2 of 88%. What is the FIRST action the nurse should take?", o: ["Administer 100% oxygen", "Stop the tube feeding immediately", "Auscultate lung sounds", "Check the NG tube placement with a pH strip"], a: 1, t: "GI Tubes/Safety", e: "The patient is exhibiting classic signs of pulmonary aspiration of the feeding formula. The absolute FIRST action is to stop the machine/feeding to prevent further fluid from entering the lungs, then oxygenate and assess." },
    { q: "A patient with chronic severe GERD is diagnosed with Barrett's Esophagus. The nurse explains to the patient that this condition involves:", o: ["Erosion of the esophageal lining causing massive bleeding", "A narrowing of the esophagus causing difficulty swallowing", "Cellular dysplasia where normal squamous epithelium is replaced by columnar epithelium, carrying a high risk of esophageal cancer", "A pouch forming in the esophagus where food collects"], a: 2, t: "Upper GI", e: "Barrett's esophagus is a precancerous condition. Chronic acid exposure causes the normal squamous cells of the esophagus to mutate into intestinal-like columnar cells to handle the acid. This severe dysplasia dramatically increases the risk of esophageal adenocarcinoma." },
    { q: "A patient with peptic ulcer disease is prescribed Omeprazole (Prilosec), Clarithromycin, and Amoxicillin. What is the specific purpose of this combination therapy?", o: ["To coat the ulcer and provide local pain relief", "To eradicate Helicobacter pylori (H. pylori) bacteria", "To neutralize stomach acid immediately", "To prevent dumping syndrome"], a: 1, t: "GI Pharmacology", e: "The vast majority of peptic ulcers are caused by H. pylori infection. The gold standard 'triple therapy' includes a Proton Pump Inhibitor (Omeprazole) to drop the acid, plus two antibiotics (Clarithromycin, Amoxicillin) to completely eradicate the bacteria." },
    { q: "A patient is admitted with suspected appendicitis. The nurse presses deeply on the left lower quadrant and quickly releases the pressure, and the patient feels a sudden, sharp pain in the RIGHT lower quadrant. This is known as:", o: ["Rovsing's sign", "Psoas sign", "Obturator sign", "Kehr's sign"], a: 0, t: "GI Assessment", e: "Rovsing's sign is classic for appendicitis. Palpation of the Left Lower Quadrant (LLQ) increases pressure inside the bowel and stretches the peritoneum, causing referred pain in the inflamed Right Lower Quadrant (RLQ)." },
    { q: "A patient with liver cirrhosis has a massive ascites buildup. The provider orders Spironolactone (Aldactone). Why is this specific diuretic preferred in liver failure?", o: ["It is the fastest acting diuretic to pull fluid rapidly", "It antagonizes aldosterone, saving potassium while wasting sodium and water, countering the massive hyperaldosteronism of cirrhosis", "It directly lowers portal vein pressure", "It increases serum albumin levels"], a: 1, t: "GI Pharmacology", e: "In cirrhosis, the failing liver cannot break down aldosterone, leading to massive secondary hyperaldosteronism (which hoards sodium/water and wastes potassium). Spironolactone specifically blocks aldosterone, diuresing the ascites fluid while saving dangerously depleted potassium." },
    { q: "A patient presents with bloody diarrhea, severe abdominal cramping, and tenesmus. Colonoscopy reveals continuous inflammation and ulceration starting at the rectum and extending up the descending colon. This is characteristic of:", o: ["Crohn's Disease", "Ulcerative Colitis", "Irritable Bowel Syndrome (IBS)", "Diverticulitis"], a: 1, t: "Lower GI", e: "Continuous inflammation starting at the rectum and restricted to the mucosal layer is the hallmark of Ulcerative Colitis. Bloody diarrhea is heavily pronounced in UC. Crohn's features skip lesions anywhere in the GI tract." },
    { q: "A patient is prescribed Sucralfate (Carafate) for a gastric ulcer. The nurse provides which instruction regarding the timing of this medication?", o: ["Take it exactly 1 hour before meals on an empty stomach", "Take it with a heavy meal to prevent stomach upset", "Take it at the same time as your antacids", "Take it immediately after eating"], a: 0, t: "GI Pharmacology", e: "Sucralfate is a cytoprotective agent that forms a thick, sticky paste in an acidic environment, physically coating and protecting the ulcer. It MUST be taken on an empty stomach 1 hour before meals. If taken with antacids, the pH is too high for it to become sticky." },
    { q: "A client with acute cholecystitis is experiencing severe pain. Where does cholecystitis pain typically radiate?", o: ["To the left shoulder", "To the right shoulder or right scapula", "To the groin and lower back", "To the umbilicus"], a: 1, t: "Pancreatic/Biliary", e: "Pain from an inflamed gallbladder (cholecystitis) typically originates in the Right Upper Quadrant (RUQ) and radiates straight to the right shoulder or right scapula due to referred nerve pathways (phrenic nerve irritation)." },
    { q: "The nurse is inserting a nasogastric (NG) tube. As the tube passes the nasopharynx, the patient begins to gag and cough. What is the nurse's best action?", o: ["Pull the tube out completely and start over", "Instruct the patient to tilt their head back and swallow", "Pause briefly, instruct the patient to tilt their chin to their chest, and take sips of water while advancing", "Force the tube down rapidly before the patient vomits"], a: 2, t: "GI Procedures", e: "Once the tube passes the nasopharynx, having the patient tuck their chin to their chest physically closes the trachea (epiglottis covers the glottis) and opens the esophagus. Swallowing water pulls the tube down smoothly into the stomach." },
    { q: "A patient with hepatic encephalopathy is receiving Rifaximin. What is the exact purpose of this antibiotic?", o: ["To treat a systemic blood infection", "To prevent spontaneous bacterial peritonitis", "To destroy normal gut flora that produce ammonia, thereby lowering serum ammonia levels", "To treat C. difficile colitis"], a: 2, t: "GI Pharmacology", e: "Rifaximin is a non-absorbable antibiotic. It stays inside the gut and kills the normal bacteria that break down protein into ammonia. By killing the bacteria, it drastically reduces ammonia production, treating the encephalopathy." },
    { q: "A patient with a bowel obstruction requires intestinal decompression. The nurse anticipates the insertion of which specific type of tube?", o: ["A standard Salem Sump NG tube", "A Miller-Abbott or Cantor tube (Nasoenteric tube)", "A Sengstaken-Blakemore tube", "A PEG tube"], a: 1, t: "GI Tubes", e: "While NG tubes decompress the stomach, a Miller-Abbott or Cantor tube is a long nasoenteric tube with a weighted balloon at the end. Peristalsis carries the tube deep into the small intestine to directly decompress a small bowel obstruction." },
    { q: "A patient with a history of alcohol abuse presents with severe epigastric pain radiating to the back, nausea, and a rigid abdomen. The serum lipase is 3,000 U/L. The patient is diagnosed with acute pancreatitis. What is the most critical initial intervention?", o: ["Administer IV Morphine and massive IV fluid resuscitation", "Administer oral clear liquids", "Prepare for an emergency cholecystectomy", "Administer IV antibiotics"], a: 0, t: "Pancreatic/Biliary", e: "Acute pancreatitis causes massive fluid shifts into the retroperitoneal space (third-spacing), leading to profound hypovolemic shock. Aggressive IV fluid resuscitation is the absolute priority, alongside keeping the patient NPO and providing potent IV pain control." },
    { q: "A patient with a sliding hiatal hernia is prescribed Metoclopramide (Reglan). The nurse must monitor for which severe, potentially irreversible side effect?", o: ["Profound bradycardia", "Tardive Dyskinesia (lip smacking, involuntary movements)", "Severe diarrhea", "Ototoxicity"], a: 1, t: "GI Pharmacology", e: "Metoclopramide is a prokinetic agent that accelerates gastric emptying. However, it crosses the blood-brain barrier and blocks dopamine. Long-term or high-dose use can cause Tardive Dyskinesia (involuntary facial/tongue movements), which can be permanent. The drug must be stopped immediately if EPS appears." },
    { q: "A patient undergoes a colonoscopy with conscious sedation. During the recovery period, the patient complains of severe, sudden abdominal pain and a rigid abdomen. What is the most likely cause?", o: ["Normal cramping from air insufflation during the procedure", "Bowel perforation", "Reaction to the sedation", "Acute appendicitis"], a: 1, t: "GI Procedures", e: "While mild cramping and flatus are perfectly normal after a colonoscopy, severe, sudden, agonizing pain and a board-like, rigid abdomen are the hallmark signs that the endoscope punctured the colon (bowel perforation). This is a surgical emergency." },
    { q: "A patient with Irritable Bowel Syndrome (IBS) is taught about dietary modifications. Which dietary advice is highly effective for managing IBS symptoms?", o: ["Adopt a high-FODMAP diet", "Adopt a low-FODMAP diet", "Increase dairy intake", "Consume large amounts of raw cabbage and beans"], a: 1, t: "Lower GI / Nutrition", e: "FODMAPs are highly fermentable short-chain carbohydrates that the small intestine has trouble absorbing. Bacteria ferment them, causing massive gas, bloating, and diarrhea. A strict low-FODMAP diet is the gold standard for reducing IBS symptoms." },
    { q: "A patient with advanced cirrhosis has massively distended, visible veins radiating outward from the umbilicus. The nurse documents this finding as:", o: ["Caput Medusae", "Spider Angiomas", "Palmar Erythema", "Ascites"], a: 0, t: "Liver / Hepatic", e: "Caput Medusae refers to the engorged, dilated superficial epigastric veins radiating from the umbilicus. It is a direct result of severe portal hypertension forcing blood to find collateral venous pathways back to the heart." },
    { q: "A client is recovering from an open cholecystectomy and has a T-tube in place. On postoperative day 2, the T-tube drains 400 mL of dark green fluid. What is the nurse's correct action?", o: ["Clamp the tube immediately", "Call the surgeon immediately, as this is a hemorrhage", "Document the finding as normal", "Irrigate the T-tube with 50 mL of normal saline"], a: 2, t: "Post-op GI / Biliary", e: "A T-tube is placed directly into the common bile duct to drain bile while the duct heals from surgical swelling. Draining 400-500 mL of thick, dark green/brown bile in the first 24-48 hours is entirely normal and expected. It will gradually decrease." },
    { q: "A patient with severe peptic ulcer disease is prescribed Misoprostol (Cytotec). The nurse must absolutely verify what before giving this drug?", o: ["The patient is not pregnant", "The patient does not have asthma", "The patient has a normal potassium level", "The patient has eaten a full meal"], a: 0, t: "GI Pharmacology", e: "Misoprostol is a synthetic prostaglandin that protects the stomach lining (often used with NSAIDs). However, it causes violent uterine contractions. It is an abortifacient and is absolutely contraindicated in pregnancy. A negative pregnancy test is mandatory." },
    { q: "Which type of Hepatitis is known as the 'Silent Killer' because it causes chronic infection leading to cirrhosis and liver cancer, and until recently, had no cure?", o: ["Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E"], a: 2, t: "Liver / Hepatic", e: "Hepatitis C is mostly transmitted via IV drug use/blood. It has no vaccine. It is largely asymptomatic for decades ('silent killer') while slowly destroying the liver (cirrhosis/cancer). Note: Highly effective antiviral cures now exist, but the disease's silent nature remains." },
    { q: "A patient with a massive lower GI bleed is passing bright red blood from the rectum. The nurse documents this as:", o: ["Melena", "Hematemesis", "Hematochezia", "Occult blood"], a: 2, t: "GI Emergencies", e: "Hematochezia is the passage of fresh, bright red blood per rectum, indicating a lower GI bleed (colon/rectum) where the blood has not been digested. Melena is dark, tarry stool (digested blood from an upper GI bleed)." },
    { q: "A patient is admitted with Acute Pancreatitis. The provider orders Total Parenteral Nutrition (TPN) with lipids. The nurse checks the patient's lab values and notes the Triglycerides are 1200 mg/dL. What must the nurse do?", o: ["Administer the TPN and Lipids as ordered", "Hold the Lipid emulsion and notify the provider", "Increase the insulin dose in the TPN", "Warm the lipid emulsion before administering"], a: 1, t: "GI Nutrition / Pancreas", e: "Extreme hypertriglyceridemia (>1000 mg/dL) is actually a common CAUSE of acute pancreatitis. Giving intravenous lipid emulsions to a patient whose triglycerides are already massively elevated will worsen the pancreatitis and sludge the blood. Lipids must be held." },
    { q: "A patient with suspected appendicitis is lying with their right hip and knee flexed. The nurse passively extends the patient's right thigh backward, causing severe RLQ pain. Which sign is positive?", o: ["Psoas sign", "Obturator sign", "Rovsing's sign", "Murphy's sign"], a: 0, t: "GI Assessment", e: "The Psoas sign is elicited by extending the right thigh backward while the patient lies on their left side. This stretches the iliopsoas muscle. If the inflamed appendix is resting against this muscle, the stretch causes extreme pain." },
    { q: "A patient with GERD asks why they should avoid caffeine, chocolate, and peppermint. The nurse correctly explains:", o: ["They are highly acidic and burn the esophagus", "They cause massive gas production in the stomach", "They decrease the tone of the Lower Esophageal Sphincter (LES), allowing acid to reflux", "They cause stomach ulcers"], a: 2, t: "Upper GI / Nutrition", e: "Caffeine, chocolate, peppermint, alcohol, and high-fat foods specifically relax the Lower Esophageal Sphincter (LES). When the sphincter is loose, stomach acid easily splashes up into the esophagus, triggering severe GERD." },
    { q: "A patient with Ulcerative Colitis is having a severe flare-up with 15 bloody stools a day. The patient develops a fever of 103°F, tachycardia, and massive abdominal distention. X-ray shows the colon is massively dilated >6cm. What catastrophic complication is occurring?", o: ["Intussusception", "Toxic Megacolon", "Bowel Obstruction", "Perforated Peptic Ulcer"], a: 1, t: "Lower GI Emergencies", e: "Toxic Megacolon is a lethal complication of UC (and severe C. diff). The inflammation reaches the smooth muscle layer, paralyzing the colon. It rapidly balloons out (distends) and is at extreme risk for spontaneous rupture. It requires emergency colectomy." },
    { q: "The nurse is administering an enema to a patient. The patient suddenly complains of severe abdominal cramping. What is the nurse's best action?", o: ["Stop the enema and remove the tube immediately", "Lower the enema bag to slow the flow", "Raise the enema bag to get the fluid in faster", "Instruct the patient to bear down"], a: 1, t: "GI Procedures", e: "Cramping during an enema is usually caused by the fluid running in too fast or the water being too cold. The nurse should simply LOWER the enema bag to decrease the gravity pressure and slow the flow rate until the cramping subsides." },
    { q: "A patient with cirrhosis has massive ascites and shortness of breath. The nurse positions the patient in high-Fowler's position. What is the physiological rationale?", o: ["It prevents esophageal varices from bleeding", "It uses gravity to pull the ascites fluid off the diaphragm, allowing the lungs to expand", "It pushes fluid into the kidneys for excretion", "It prevents hepatic encephalopathy"], a: 1, t: "Liver / Hepatic", e: "Massive ascites pushes the diaphragm violently upward, physically crushing the lungs and causing severe dyspnea. Sitting the patient upright drops the fluid down via gravity, freeing the diaphragm and restoring respiratory capacity." },
    { q: "A patient with peptic ulcer disease is prescribed a Proton Pump Inhibitor (Pantoprazole). How exactly does this medication work to heal the ulcer?", o: ["It forms a protective gel over the ulcer crater", "It neutralizes existing stomach acid", "It permanently binds to and blocks the H+/K+ ATPase enzyme pump in the parietal cells, shutting down acid production", "It blocks H2 histamine receptors on the parietal cell"], a: 2, t: "GI Pharmacology", e: "Proton Pump Inhibitors (PPIs - ending in 'prazole') are the most potent acid reducers. They irreversibly bind to the gastric proton pump (H+/K+ ATPase) in the parietal cells, completely halting the final step of acid secretion." },
    { q: "A client who recently underwent a massive bowel resection for Crohn's disease is receiving TPN. They are transitioning to oral feeding. The nurse knows this patient is at lifelong risk for which specific deficiency, requiring lifelong injections?", o: ["Vitamin C", "Vitamin B12", "Iron", "Folic Acid"], a: 1, t: "GI Nutrition / Surgeries", e: "Vitamin B12 is absorbed exclusively in the terminal ileum. Patients with severe Crohn's disease (which heavily affects the terminal ileum) or who have had ileal resections completely lose the ability to absorb B12 orally. They will develop pernicious anemia without lifelong IM B12 injections." },
    { q: "A patient with a strangulated hernia requires emergency surgery. What defines a 'strangulated' hernia compared to an 'incarcerated' hernia?", o: ["An incarcerated hernia cannot be pushed back in; a strangulated hernia has its blood supply cut off, causing necrosis", "A strangulated hernia can be easily reduced manually", "An incarcerated hernia is painless; a strangulated hernia is only mildly painful", "A strangulated hernia involves the stomach sliding into the chest"], a: 0, t: "Lower GI", e: "An incarcerated hernia means the bowel is trapped in the hernia sac and cannot be pushed back in (irreducible). If the hole is tight enough to clamp down on the blood vessels, it becomes a STRANGULATED hernia. The bowel quickly dies (necrosis), making it an extreme surgical emergency." },
    { q: "A nurse is checking the residual volume of a patient receiving continuous NG tube feedings. The residual is 100 mL. What is the correct action?", o: ["Discard the 100 mL and hold the feeding", "Return the 100 mL to the stomach and continue the feeding at the prescribed rate", "Return the 100 mL and stop the feeding for 2 hours", "Discard the 100 mL and increase the feeding rate"], a: 1, t: "GI Tubes", e: "A residual volume of 100 mL is perfectly normal and indicates adequate gastric emptying (thresholds for holding feeds are typically > 250-500 mL). The nurse MUST return the aspirate to the stomach to prevent electrolyte/acid loss, and simply continue the feeding." },
    { q: "A patient with liver cirrhosis has a serum albumin of 1.8 g/dL (Normal 3.5-5.0). This massive deficit directly causes which classic complication of cirrhosis?", o: ["Hepatic Encephalopathy", "Bleeding esophageal varices", "Severe ascites and generalized peripheral edema", "Jaundice"], a: 2, t: "Liver / Hepatic", e: "Albumin is the massive protein sponge that holds water inside the blood vessels (oncotic pressure). When the failing liver stops making albumin, oncotic pressure plummets. Water freely leaks out of the veins into the peritoneal cavity (ascites) and the tissues (anasarca/edema)." },
    { q: "A patient with cholecystitis is prescribed Ursodeoxycholic acid (Ursodiol). The patient asks what this medication does. The nurse explains:", o: ["'It acts as a strong painkiller specifically for the gallbladder.'", "'It dissolves cholesterol gallstones slowly over many months.'", "'It prevents the pancreas from auto-digesting.'", "'It kills the bacteria causing the gallbladder infection.'"], a: 1, t: "GI Pharmacology", e: "Ursodiol is a bile acid given orally to patients who are not surgical candidates. It physically changes the composition of bile, slowly dissolving small, cholesterol-based gallstones over 6 to 12 months. It does not work on calcified stones." },
    { q: "A patient presents with acute appendicitis. The WBC count is 18,000/mm3. The nurse is preparing the patient for surgery. Which intervention is absolutely CONTRAINDICATED?", o: ["Administering IV fluids", "Placing the patient in semi-Fowler's position", "Applying a heating pad to the right lower quadrant for pain relief", "Keeping the patient NPO"], a: 2, t: "GI Emergencies", e: "Applying HEAT to an inflamed appendix causes massive vasodilation and pulls blood to the area. This drastically increases pressure inside the appendix, almost guaranteeing it will rupture. Ice packs can be used, but NEVER heat." },
    { q: "A patient has a Sengstaken-Blakemore tube in place. To ensure the esophageal balloon does not cause pressure necrosis of the esophagus, the nurse must ensure the pressure is kept at:", o: ["5 - 10 mmHg", "20 - 45 mmHg", "60 - 80 mmHg", "100 - 120 mmHg"], a: 1, t: "GI Tubes", e: "The esophageal balloon is inflated to tamponade (crush) the bleeding varices against the esophageal wall. The safe pressure is 20 to 45 mmHg. Pressures higher than this will completely cut off blood supply to the esophagus, causing catastrophic tissue necrosis and rupture." },
    { q: "A patient with severe acute pancreatitis is placed on strict NPO status and given IV Dilaudid for pain. Which position will naturally provide the most pain relief for this patient?", o: ["Supine, completely flat", "Lying on the left side with knees drawn up to the chest (fetal position)", "Prone position", "Trendelenburg position"], a: 1, t: "Pancreatic/Biliary", e: "The pancreas is a retroperitoneal organ. Lying flat stretches the abdominal wall tightly over the inflamed pancreas, causing agony. Sitting up, leaning forward, or lying in a fetal position (knees to chest) relaxes the abdominal muscles and pulls the organs away from the retroperitoneal space, relieving pain." },
    
    // PEDIATRIC GI (61-80)
    { q: "A 3-week-old male infant presents with projectile, non-bilious vomiting immediately after every feeding. The infant is constantly hungry. Upon palpation, the nurse feels an olive-shaped mass in the right upper quadrant. What is the diagnosis?", o: ["Intussusception", "Hirschsprung's Disease", "Hypertrophic Pyloric Stenosis", "Esophageal Atresia"], a: 2, t: "Peds GI", e: "The pyloric sphincter connects the stomach to the duodenum. In Pyloric Stenosis, the muscle hypertrophies (thickens into an 'olive-shaped' mass), completely blocking the exit. The stomach aggressively contracts, resulting in forceful, non-bilious, projectile vomiting. The infant is starving and instantly hungry again." },
    { q: "A newborn fails to pass meconium within the first 48 hours. The abdomen becomes massively distended, and the infant vomits bilious fluid. A rectal biopsy shows a complete absence of parasympathetic ganglion cells in the distal colon. Diagnosis?", o: ["Meconium Ileus", "Hirschsprung's Disease (Aganglionic Megacolon)", "Necrotizing Enterocolitis (NEC)", "Biliary Atresia"], a: 1, t: "Peds GI", e: "Hirschsprung's disease is the congenital absence of nerve cells (ganglion cells) in the lower colon. Without nerves, there is zero peristalsis in that segment. It creates a physical roadblock; stool and gas back up massively (megacolon), and the infant cannot pass meconium." },
    { q: "A 9-month-old infant suddenly draws their knees to their chest, screams in severe pain, and passes a stool that looks like 'red currant jelly'. An ultrasound shows a 'target sign'. What is the immediate treatment of choice?", o: ["Emergency bowel resection", "Administration of IV Pancrelipase", "A hydrostatic (air or barium) enema", "Administration of high-dose corticosteroids"], a: 2, t: "Peds GI", e: "This is Intussusception (the bowel telescopes inside itself). The swelling causes bleeding and mucus ('currant jelly' stool). A hydrostatic enema (pumping air or liquid into the rectum under pressure) physically pushes the telescoped bowel back out into its normal position, curing it 80% of the time without surgery." },
    { q: "A newborn is choking, coughing, and turns deeply cyanotic during the very first feeding. Copious frothy saliva is coming from the mouth and nose. The nurse suspects Esophageal Atresia with Tracheoesophageal Fistula (EA/TEF). What is the priority nursing action?", o: ["Attempt to force the feed down", "Lay the infant flat on their back", "Stop the feed immediately, elevate the Head of Bed, and place a continuous suction catheter in the blind esophageal pouch", "Administer Epinephrine"], a: 2, t: "Peds GI", e: "In EA/TEF, the esophagus ends in a blind pouch and connects to the trachea. Feeding the infant causes milk to spill directly into the lungs. The priority is to stop feeding, elevate the HOB to stop stomach acid from refluxing into the lungs, and continuously suction the saliva out of the blind pouch to prevent aspiration." },
    { q: "An infant is born with an Omphalocele. The nurse knows that Omphalocele differs from Gastroschisis because:", o: ["Gastroschisis involves the bladder, Omphalocele involves the stomach", "Omphalocele has the intestines covered by a protective peritoneal membrane/sac, while Gastroschisis has raw intestines completely exposed to amniotic fluid without a sac", "Omphalocele is located on the back, Gastroschisis is on the abdomen", "Gastroschisis resolves on its own without surgery"], a: 1, t: "Peds GI", e: "Omphalocele is a herniation of abdominal organs through the umbilical ring, securely enclosed in a translucent peritoneal sac. Gastroschisis is a hole usually to the right of the umbilicus where the intestines spill completely OUTSIDE the body with NO sac covering them, risking massive infection and necrosis." },
    { q: "A 4-week-old infant has prolonged jaundice. The stools become pale and clay-colored, and the urine is dark. Blood tests show severely elevated direct (conjugated) bilirubin. What is the highly lethal diagnosis that requires a Kasai procedure?", o: ["Physiological Jaundice of the newborn", "Biliary Atresia", "Cystic Fibrosis", "Hepatitis A"], a: 1, t: "Peds GI", e: "Biliary Atresia is a congenital condition where the bile ducts outside the liver are completely obliterated/closed. Bile cannot drain into the intestine (hence white/clay-colored stools) and backs up into the liver, rapidly destroying it (cirrhosis). The Kasai procedure surgically creates a new drainage pathway." },
    { q: "A child is diagnosed with Celiac Disease. The mother asks which foods to include in the diet. The nurse advises the mother to feed the child:", o: ["Whole wheat pasta and rye bread", "Oatmeal and barley soup", "Rice, corn, potatoes, and fresh meats/vegetables", "Graham crackers and malted milk"], a: 2, t: "Peds GI", e: "Celiac disease requires absolute lifelong avoidance of Gluten (found in Wheat, Barley, Rye, and often cross-contaminated Oats - the BROW acronym). Rice, corn, potatoes, quinoa, and unprocessed meats/fruits/veggies are perfectly safe and naturally gluten-free." },
    { q: "An infant has a cleft lip repair (Cheiloplasty) performed. Post-operatively, how must the nurse position the infant to protect the delicate surgical site?", o: ["Strictly PRONE (on the stomach)", "Supine (on the back) or side-lying, often with elbow restraints", "Trendelenburg", "Knee-chest position"], a: 1, t: "Peds GI", e: "After a cleft lip repair, the infant must NEVER be placed on their stomach (prone). If they rub their face into the mattress, they will rip open the delicate suture line. They must sleep on their back or side. Elbow immobilizers (No-No's) are used to prevent them from putting their hands in their mouth." },
    { q: "A child with Cystic Fibrosis has a foul-smelling, bulky, greasy, and floating stool. The nurse documents this clinical finding as:", o: ["Melena", "Hematochezia", "Steatorrhea", "Meconium"], a: 2, t: "Peds GI", e: "Steatorrhea is the excretion of massive amounts of undigested fat in the feces. Because the thick mucus of Cystic Fibrosis blocks pancreatic lipase from reaching the gut, fats are not digested or absorbed. The stool becomes fatty, extremely foul-smelling, and floats." },
    { q: "A premature neonate in the NICU develops abdominal distention, bilious vomiting, and bloody stools. An abdominal X-ray shows pneumatosis intestinalis (air bubbles strictly inside the bowel wall). What is the terrifying diagnosis?", o: ["Necrotizing Enterocolitis (NEC)", "Hirschsprung's Disease", "Intussusception", "Pyloric Stenosis"], a: 0, t: "Peds GI", e: "NEC is an acquired disease in preemies where a portion of the bowel literally dies (necrosis) due to ischemia and bacterial invasion. Bacteria produce gas inside the wall of the dying bowel (pneumatosis intestinalis). It is a catastrophic emergency requiring immediate bowel rest, antibiotics, and often surgery." },
    { q: "A child swallows a button battery that becomes lodged in the esophagus. What is the nurse's understanding of this specific foreign body ingestion?", o: ["It will pass safely within 3 days; encourage high-fiber foods", "It is a severe medical emergency requiring immediate endoscopic removal because the electrical current rapidly burns a hole through the esophagus", "Administer GoLytely to flush it out", "Perform the Heimlich maneuver immediately"], a: 1, t: "Peds GI Emergencies", e: "A button battery in the esophagus is a ticking time bomb. The saliva completes an electrical circuit, generating hydroxide ions that cause severe liquefaction necrosis. It can burn entirely through the esophagus into the aorta in less than 2 hours. Immediate endoscopic extraction is mandatory." },
    { q: "An adolescent is admitted with suspected Crohn's Disease. The nurse is assessing the perianal area. Which finding is highly characteristic of Crohn's disease and rarely seen in Ulcerative Colitis?", o: ["A single bleeding hemorrhoid", "Multiple perianal fistulas, skin tags, and deep anal fissures", "A prolapsed rectum", "Pinworm infection"], a: 1, t: "Peds GI", e: "Because Crohn's disease causes TRANSMURAL inflammation (it eats completely through all layers of the bowel wall), it creates tunnels (fistulas) to other organs or the skin. Severe perianal disease (fistulas, deep fissures, and skin tags) is a hallmark of Crohn's and helps distinguish it from UC." },
    { q: "A 2-year-old child presents with a sudden, massive GI bleed resulting in painless, bright red blood from the rectum. A nuclear medicine scan (technetium-99m) is positive. What congenital remnant is causing this bleeding?", o: ["Meckel's Diverticulum", "A ruptured appendix", "Bleeding esophageal varices", "A bleeding gastric ulcer"], a: 0, t: "Peds GI", e: "Meckel's Diverticulum is a congenital remnant of the vitelline duct. It often contains ectopic gastric tissue that secretes stomach acid directly onto the unprotected intestinal wall, causing a massive, painless ulceration and bright red lower GI bleeding. A Meckel's scan detects the ectopic stomach tissue." },
    { q: "A newborn requires a nasogastric tube. How does the nurse correctly measure the length of the NG tube to ensure it reaches the stomach?", o: ["From the tip of the nose to the earlobe, and then down to the umbilicus", "From the tip of the nose, to the earlobe, and down to the xiphoid process (NEX method)", "From the chin to the sternum", "Guess based on the baby's weight"], a: 1, t: "Peds GI Procedures", e: "The standard and correct measurement for placing a gastric tube in pediatric (and adult) patients is the NEX method: measure from the Tip of the Nose, to the Earlobe, and down to the Xiphoid process." },
    { q: "A mother brings her infant to the clinic, stating the baby cries inconsolably for 3 hours a day, at least 3 days a week, mostly in the evening, drawing their legs up to their belly. The baby is growing completely normally. What is the diagnosis?", o: ["Gastroesophageal Reflux Disease (GERD)", "Infantile Colic", "Lactose Intolerance", "Pyloric Stenosis"], a: 1, t: "Peds GI", e: "The Rule of 3s defines Infantile Colic: crying >3 hours a day, >3 days a week, for >3 weeks in an otherwise completely healthy, well-fed, and growing infant. It is mysterious, benign, and self-resolves around 3-4 months of age." },

    // ADVANCED GI PHARMACOLOGY & NUTRITION (81-100)
    { q: "A patient with bleeding esophageal varices receives an IV infusion of Octreotide (Sandostatin). The nurse understands the explicit mechanism of action is to:", o: ["Form a protective clot directly over the bleeding varix", "Decrease splanchnic (abdominal) blood flow, drastically reducing pressure in the portal vein and halting the variceal bleed", "Neutralize stomach acid completely to prevent erosion", "Increase systemic blood pressure to treat the shock"], a: 1, t: "GI Pharmacology", e: "Octreotide is a synthetic somatostatin. It selectively causes massive vasoconstriction of the splanchnic (abdominal organ) arterial bed. This drastically decreases the volume of blood rushing into the portal vein, dropping portal pressure instantly and stopping the bleeding varices." },
    { q: "A patient with Hepatitis C is prescribed Pegylated Interferon Alfa. The nurse warns the patient to expect which extremely common, debilitating side effect that often causes patients to stop the medication?", o: ["Severe, flu-like symptoms (high fever, chills, severe muscle aches)", "Massive weight gain", "Orange-colored urine and tears", "Complete permanent baldness"], a: 0, t: "GI Pharmacology", e: "Interferons are potent immune system modulators. Injecting them essentially forces the body into an extreme antiviral immune response. The classic, unavoidable side effect is a brutal 'flu-like syndrome' (fever, chills, myalgia, severe fatigue) that happens with almost every injection." },
    { q: "A patient with severe Crohn's disease requires long-term Total Parenteral Nutrition (TPN). The nurse monitors the patient for which severe complication specific to LONG-TERM, exclusive TPN therapy?", o: ["Gastric ulcer formation", "Hepatobiliary dysfunction (Steatohepatitis and Gallstones)", "Crohn's disease exacerbation", "Kidney stones"], a: 1, t: "GI Nutrition", e: "If the gut is not used (NPO on TPN), the gallbladder does not receive CCK signals to empty. Bile sits in the gallbladder and forms stones (biliary stasis/sludge). Furthermore, the massive continuous carbohydrate/lipid load from TPN causes fatty liver (hepatic steatosis) and liver failure over time." },
    { q: "A patient is prescribed Orlistat (Xenical) for severe obesity. The nurse must provide thorough education on the side effects of this lipase inhibitor. What will happen if the patient eats a high-fat meal while taking Orlistat?", o: ["Severe hypertensive crisis", "Sudden cardiac arrest", "Explosive, oily, uncontrollable diarrhea and fecal incontinence", "Severe constipation and bowel obstruction"], a: 2, t: "GI Pharmacology", e: "Orlistat works by blocking pancreatic lipase, meaning fats eaten in the diet cannot be digested or absorbed. If the patient eats a high-fat meal, the fat passes straight through the colon in its raw, liquid oil form, causing horrific, explosive steatorrhea and oily spotting." },
    { q: "A patient with C. difficile colitis is prescribed oral Vancomycin. The patient asks why they are receiving the pill form instead of the IV form. The nurse correctly replies:", o: ["'The pill is much cheaper than the IV bag.'", "'Oral Vancomycin is not absorbed into the blood; it stays entirely inside the colon to directly kill the C. difficile bacteria on the bowel wall.'", "'The IV form causes Red Man Syndrome, which is fatal in C. diff.'", "'C. diff eats the IV medication before it works.'"], a: 1, t: "GI Pharmacology", e: "Vancomycin is a massive molecule. When given orally, absolutely zero percent of it is absorbed into the bloodstream. It remains entirely trapped inside the gastrointestinal tract, bathing the C. diff bacteria in high concentrations of the antibiotic where it lives." },
    { q: "A patient with acute pancreatitis is in severe pain. The provider orders IV Hydromorphone (Dilaudid). Historically, Meperidine (Demerol) was used, but it is now strictly avoided. Why is Meperidine contraindicated?", o: ["It causes deadly spasms of the Sphincter of Oddi", "It metabolizes into normeperidine, a toxic metabolite that causes uncontrollable seizures", "It is instantly deactivated by pancreatic lipase", "It causes massive histamine release and anaphylaxis"], a: 1, t: "GI Pharmacology", e: "While Meperidine was once thought to cause fewer Sphincter of Oddi spasms than Morphine, the real reason it is banned is its toxic metabolite, Normeperidine. It builds up rapidly (especially in dehydration/renal issues common in pancreatitis) and causes fatal, untreatable CNS toxicity and seizures." },
    { q: "A patient with hepatic encephalopathy is prescribed Neomycin orally. The patient has a history of severe Chronic Kidney Disease. Why must the nurse QUESTION this specific order?", o: ["Neomycin cures kidney failure", "Neomycin is highly nephrotoxic and ototoxic, and even small systemic absorption can completely destroy the remaining kidneys", "Neomycin binds to calcium and causes bone fractures", "Neomycin will worsen the encephalopathy"], a: 1, t: "GI Pharmacology", e: "Neomycin is an aminoglycoside antibiotic. While mostly staying in the gut to kill ammonia-producing bacteria, a tiny fraction is absorbed. In a patient with existing kidney failure, even this tiny amount is massively nephrotoxic and ototoxic (deafness). Rifaximin is the much safer alternative." },
    { q: "A patient receives an injection of Promethazine (Phenergan) IV push for severe nausea. The nurse knows that pushing this medication too quickly into a peripheral IV can result in what catastrophic complication?", o: ["Severe tissue necrosis and gangrene leading to amputation of the limb", "Instantaneous cardiac arrest", "Massive pulmonary embolism", "Permanent blindness"], a: 0, t: "GI Pharmacology", e: "Promethazine is a severe vesicant with a pH of 4. If it extravasates (leaks out of the vein) or hits an artery, it causes horrific chemical burns, tissue necrosis, and gangrene, often requiring surgical amputation of the arm/fingers. It must be heavily diluted and pushed very slowly into a large vein." },
    { q: "A patient with PUD asks how Bismuth Subsalicylate (Pepto-Bismol) helps cure their ulcer. The nurse explains:", o: ["'It completely neutralizes all stomach acid.'", "'It coats the ulcer and has a direct antibacterial effect against H. pylori.'", "'It paralyzes the stomach muscles.'", "'It increases the production of gastrin.'"], a: 1, t: "GI Pharmacology", e: "Bismuth is a unique compound. Not only does it coat the stomach lining to protect it from acid, but it is actually highly toxic to Helicobacter pylori (H. pylori), destroying the bacterial cell wall. It also turns the stool harmlessly black." },
    { q: "A patient with hyperemesis gravidarum is prescribed Ondansetron (Zofran). The nurse must check the patient's ECG for which specific dangerous finding before administering?", o: ["ST segment elevation", "Prolonged QT interval", "First degree AV block", "Inverted T waves"], a: 1, t: "GI Pharmacology", e: "Ondansetron (a 5-HT3 receptor antagonist) is an incredibly effective antiemetic. However, its most dangerous side effect is that it prolongs the QT interval on the ECG. In a patient who is already hypokalemic from severe vomiting, giving Zofran can trigger Torsades de Pointes (lethal ventricular tachycardia)." },
    { q: "A patient with chronic idiopathic constipation is prescribed Linaclotide (Linzess). The nurse explains the mechanism of action is:", o: ["It forms a massive, bulky gel that expands the colon", "It stimulates the nerves in the colon wall to spasm and push stool out", "It acts locally in the intestine to massively increase the secretion of chloride and water into the bowel lumen, speeding transit", "It coats the stool in mineral oil to make it slippery"], a: 2, t: "GI Pharmacology", e: "Linaclotide is a guanylate cyclase-C agonist. It binds to receptors on the intestinal wall, forcing the cells to pump massive amounts of chloride and water directly INTO the intestinal lumen. This floods the intestines with water, softening the stool and triggering rapid bowel movements." },
    { q: "A patient with severe diarrhea from Irritable Bowel Syndrome (IBS-D) is prescribed Loperamide (Imodium). The nurse teaches the patient that taking massive overdoses of this over-the-counter drug can lead to:", o: ["Complete liver failure", "Cardiac arrhythmias and fatal cardiac arrest", "Internal bleeding", "Permanent loss of taste"], a: 1, t: "GI Pharmacology", e: "Loperamide is an opioid agonist that normally does not cross the blood-brain barrier. However, drug abusers take massive, toxic overdoses to try and get high. In massive doses, Loperamide is highly cardiotoxic, causing profound QT prolongation, V-Tach, V-Fib, and sudden cardiac death." },
    { q: "A patient with inflammatory bowel disease is placed on long-term systemic Corticosteroids (Prednisone). Which of the following is NOT a known side effect of long-term steroid therapy?", o: ["Osteoporosis and bone fractures", "Hyperglycemia (Steroid-induced diabetes)", "Severe hypotension and hyperkalemia", "Immunosuppression and delayed wound healing"], a: 2, t: "GI Pharmacology", e: "Corticosteroids mimic cortisol and aldosterone. They cause the body to RETAIN sodium and water (causing Hypertension, not hypotension) and WASTE potassium (causing Hypokalemia, not hyperkalemia). Side effects include osteoporosis, hyperglycemia, immunosuppression, and weight gain (moon face/buffalo hump)." },
    { q: "A patient with Hepatitis B is prescribed Tenofovir. The nurse knows this medication belongs to which specific class of drugs?", o: ["Protease Inhibitor", "Nucleotide Reverse Transcriptase Inhibitor (NRTI)", "Monoclonal Antibody", "Direct Acting Antiviral (DAA) for Hep C"], a: 1, t: "GI Pharmacology", e: "Tenofovir is a potent NRTI. It acts as a fake building block for viral DNA. When the Hepatitis B virus tries to copy itself, it grabs the Tenofovir, which breaks the DNA chain, completely stopping the virus from replicating. (Also heavily used in HIV treatment)." },
    { q: "A patient presents with massive acetaminophen (Tylenol) overdose, attempting suicide. The liver is failing rapidly. What is the definitive, life-saving antidote that must be administered?", o: ["N-acetylcysteine (Mucomyst)", "Flumazenil", "Naloxone", "Protamine Sulfate"], a: 0, t: "GI Emergencies / Tox", e: "Acetaminophen overdose saturates normal liver pathways, forcing the drug down a toxic pathway that creates NAPQI, which obliterates liver cells. N-acetylcysteine (NAC) replenishes the liver's stores of glutathione, which safely binds and neutralizes the deadly NAPQI, saving the liver from destruction." },
    { q: "A patient is ordered a colonoscopy and prescribed Polyethylene Glycol (GoLytely) for bowel prep. The patient has a history of heart failure. Why is GoLytely uniquely safe for this patient compared to fleet enemas?", o: ["It is an osmotically balanced solution that cleans the bowel without pulling any fluid or electrolytes into or out of the bloodstream", "It contains massive amounts of diuretics to pull fluid off the heart", "It works completely mechanically by scraping the bowel", "It is given via IV, bypassing the gut"], a: 0, t: "GI Procedures / Pharma", e: "GoLytely is an iso-osmotic laxative. You drink a massive volume (4 Liters), and that exact same 4 Liters flushes straight out of the colon. It does not pull water from the blood, nor does it push salt into the blood. Therefore, it will not cause fluid shifts, protecting the failing heart." },
    { q: "A patient with an active gastric ulcer is prescribed Misoprostol. The patient asks why they can't just take an NSAID like Ibuprofen for their joint pain. The nurse explains the pathophysiology:", o: ["'NSAIDs coat the stomach, making the ulcer worse.'", "'NSAIDs directly burn a hole in the stomach lining on contact.'", "'NSAIDs block the production of protective prostaglandins, which normally maintain the thick mucus barrier that protects your stomach from its own acid.'", "'NSAIDs stimulate massive amounts of acid production.'"], a: 2, t: "GI Pharmacology", e: "Prostaglandins are the architects of the stomach's defenses; they command the stomach to produce thick, protective mucus and bicarbonate. NSAIDs completely block the COX-1 enzyme, destroying prostaglandin production. Without prostaglandins, the stomach has no mucus shield, and its own acid eats right through the wall." },
    { q: "A patient receiving TPN develops a fever of 103°F, chills, and hypotension. The central line insertion site is red and oozing pus. What is the absolute FIRST priority action?", o: ["Administer IV broad-spectrum antibiotics through the central line", "Stop the TPN, pull the central line, and culture the tip", "Increase the TPN rate to flush the line", "Administer Acetaminophen to lower the fever"], a: 1, t: "GI Nutrition / Emergencies", e: "The patient has a Central Line-Associated Bloodstream Infection (CLABSI) likely progressing to septic shock. TPN is a massive sugar reservoir, making it the perfect breeding ground for bacteria. The infected line is the source. The source MUST be removed instantly, and the catheter tip cut off and sent to the lab to identify the deadly bacteria." },
    { q: "A patient with Ulcerative Colitis is prescribed a 5-ASA derivative, Mesalamine (Asacol). Where exactly is the pill designed to dissolve and exert its topical anti-inflammatory effect?", o: ["In the highly acidic stomach", "In the duodenum to be absorbed into the blood", "The pill has a pH-sensitive coating that prevents it from dissolving until it reaches the terminal ileum and colon", "It dissolves entirely in the mouth"], a: 2, t: "GI Pharmacology", e: "Mesalamine needs to act topically on the inflamed lining of the colon. If it dissolved in the stomach, it would be absorbed into the blood and lost. The pills (like Asacol) have a specialized enteric coating that will not dissolve until it hits the high pH (alkaline) environment of the colon, delivering the drug directly to the disease site." },
    { q: "A patient with severe short bowel syndrome (SBS) is entirely dependent on TPN for survival. The patient develops end-stage TPN-induced liver failure. What is the ONLY definitive cure for this patient's dual terminal conditions?", o: ["A permanent feeding tube", "A massive dose of Ursodiol", "An isolated Liver transplant", "A combined, simultaneous Liver and Small Bowel transplant"], a: 3, t: "GI Advanced Cases", e: "The patient has no functional bowel to eat (SBS) and now their liver has been destroyed by the TPN keeping them alive. If you just transplant the liver, they still need TPN, which will destroy the new liver. The only definitive, life-saving cure is a highly complex, simultaneous transplant of both a new liver AND a new small intestine." }
];

let currentQ = 0;
let score = 0;
let answeredCount = 0;
let answersData = new Array(questions.length).fill(null);

const quizBody = document.getElementById('quiz-body');
const scoreEl = document.getElementById('score');
const qCounterEl = document.getElementById('q-counter');
const progressEl = document.getElementById('progress');

function initQuiz() {
    questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = `question-container ${index === 0 ? 'active' : ''}`;
        qDiv.id = `question-${index}`;
        
        qDiv.innerHTML = `
            <div class="subject-tag">${q.t}</div>
            <div class="q-text">Q${index + 1}: ${q.q}</div>
            <div class="options" id="options-${index}">
                ${q.o.map((opt, optIndex) => `
                    <button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, this)">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </button>
                `).join('')}
            </div>
            <div class="rationale" id="rationale-${index}">
                <strong>Clinical Rationale:</strong> ${q.e}
            </div>
            <div class="navigation">
                <button class="nav-btn" onclick="changeQuestion(-1)" ${index === 0 ? 'disabled' : ''}>Previous</button>
                <button class="nav-btn" onclick="changeQuestion(1)">${index === questions.length - 1 ? 'Submit Exam' : 'Next Question'}</button>
            </div>
        `;
        quizBody.appendChild(qDiv);
    });
    updateProgress();
}

function checkAnswer(qIndex, selectedOptIndex, btnElement) {
    if (answersData[qIndex] !== null) return; 
    
    const optionsContainer = document.getElementById(`options-${qIndex}`);
    const buttons = optionsContainer.querySelectorAll('.option-btn');
    const correctIndex = questions[qIndex].a;
    const rationaleBox = document.getElementById(`rationale-${qIndex}`);

    answersData[qIndex] = selectedOptIndex;
    buttons.forEach(btn => btn.classList.add('disabled'));

    if (selectedOptIndex === correctIndex) {
        btnElement.classList.add('correct');
        score += 1;
    } else {
        btnElement.classList.add('incorrect');
        buttons[correctIndex].classList.add('correct'); 
        score -= 0.3333; 
    }
    
    rationaleBox.style.display = 'block';
    answeredCount++;
    scoreEl.innerText = score.toFixed(2);
}

function changeQuestion(direction) {
    if (direction === 1 && currentQ === questions.length - 1) {
        finishExam();
        return;
    }
    
    document.getElementById(`question-${currentQ}`).classList.remove('active');
    currentQ += direction;
    document.getElementById(`question-${currentQ}`).classList.add('active');
    
    qCounterEl.innerText = `Question: ${currentQ + 1} / 100`;
    updateProgress();
    window.scrollTo(0, 0);
}

function updateProgress() {
    const percent = ((currentQ + 1) / questions.length) * 100;
    progressEl.style.width = `${percent}%`;
}

function finishExam() {
    let unattempted = questions.length - answeredCount;
    if(unattempted > 0) {
        let confirmFinish = confirm(`WARNING: You have ${unattempted} unattempted questions. Submit anyway?`);
        if(!confirmFinish) return;
    }

    quizBody.style.display = 'none';
    document.querySelector('.dashboard').style.display = 'none';
    document.querySelector('.progress-bar').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    
    let finalScoreFormatted = score < 0 ? "0.00" : score.toFixed(2);
    document.getElementById('final-score-display').innerText = `${finalScoreFormatted} / 100`;
}

window.onload = initQuiz;
</script>

</body>
</html>
